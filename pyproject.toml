[build-system]
requires = ["hatchling>=1,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "isic-cli"
description = "The official command line tool for interacting with the ISIC Archive."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
maintainers = [{ name = "Kitware, Inc.", email = "kitware@kitware.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.2.0",
  "django-s3-file-field-client>=1.0.0",
  # We expect girder-cli-oauth-client to drop oob support in the future
  "girder-cli-oauth-client<1.0.0",
  "humanize",
  "isic-metadata>=5.0.0",
  "more-itertools",
  "packaging",
  "requests",
  "retryable-requests",
  "rich",
  "sentry-sdk",
  "tenacity",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ImageMarkup/isic-cli"
"Bug Reports" = "https://github.com/ImageMarkup/isic-cli/issues"

[project.scripts]
isic = "isic_cli.cli:main"

[dependency-groups]
dev = [
  "ipython",
  "tox",
  "tox-uv",
]
lint = [
  "ruff==0.5.0",
]
type = [
  "pyright",
]
test = [
  "pytest",
  "pytest-lazy-fixtures",
  "pytest-mock",
]
package = [
  "pyinstaller",
]

[tool.hatch.build]
only-include = [
  "isic_cli",
]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Incompatible with formatter
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
  "D206", # indent-with-spaces
  "D300", # triple-single-quotes
  "E111", # indentation-with-invalid-multiple
  "E114", # indentation-with-invalid-multiple-comment
  "E117", # over-indented
  "ISC001", # single-line-implicit-string-concatenation
  "ISC002", # multi-line-implicit-string-concatenation
  "Q", # flake8-quotes
  "W191", # tab-indentation

  "A003", # Class attribute is shadowing a Python builtin
  "ANN", # flake8-annotations
  "ARG001", # Unused function argument
  "ARG002", # Unused method argument
  "D1", # Missing docstring
  "EM101", # Exception must not use a string literal, assign to variable first
  "EM102", # Exception must not use an f-string literal, assign to variable first
  "ERA001", # Found commented-out code
  "FIX", # flake8-fixme
  "TD002", # Missing author in TODO
  "TD003", # Missing issue link on the line following this TODO
  "TRY003", # Avoid specifying long messages outside the exception class

  # Excessive
  "RET503", # implict return
  "RET506", # elif after raise
  "PLR2004", # magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "PLR0913", # Too many arguments to function call
  "PLR2004", # Magic value used in comparison
  "S", # flake8-bandit
  "SLF001", # Private member accessed
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# Sort by name, don't cluster "from" vs "import"
force-sort-within-sections = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--showlocals",
  "--verbose",
]
