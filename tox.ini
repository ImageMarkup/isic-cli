[tox]
min_version = 4.22
requires =
    tox-uv
env_list =
    lint
    test

[testenv]
runner = uv-venv-lock-runner

[testenv:lint]
package = skip
dependency_groups =
    lint
commands =
    ruff check {posargs:.}
    ruff format --check {posargs:.}

[testenv:format]
package = skip
dependency_groups =
    lint
commands =
    ruff check --fix-only {posargs:.}
    ruff format {posargs:.}

[testenv:type]
package = skip
dependency_groups =
    type
commands =
    pyright {posargs:.}

[testenv:test]
dependency_groups =
    test
commands =
    pytest {posargs}

[testenv:package]
# PyInstaller needs the real package files in site-packages, not an editable install
package = wheel
passenv =
    ISIC_CLI_SENTRY_DSN
dependency_groups =
    package
# charset_normalizer ships mypyc-compiled extensions with pure python fallbacks. on macOS, each
# shared library extracted by the onefile binary costs ~120ms per launch, so build it from source
# to get the pure python version instead.
uv_sync_flags =
    --no-binary-package
    charset-normalizer
commands =
    python scripts/write_sentry_dsn_module.py {env_tmp_dir}/sentry_dsn/_isic_cli_sentry_dsn.py
    pyinstaller \
        --clean \
        --noconfirm \
        --onefile \
        --name isic \
        --paths {env_tmp_dir}/sentry_dsn \
        --recursive-copy-metadata isic_cli \
        --collect-data isic_cli \
        --specpath {env_tmp_dir} \
        --workpath {env_tmp_dir} \
        --collect-all dateutil \
        {env_site_packages_dir}/isic_cli/cli/__main__.py
